# touchpoint · CI
#
# 여기서 도는 것은 셋뿐이다 — 문법, 단위 테스트, 구성 파일 유효성.
# 배포는 하지 않는다. 서버가 한 대뿐이라 자동 배포의 이득보다
# 잘못 나갔을 때의 손해가 크다. → docs/decisions/ADR-011-github-actions-over-jenkins.md
#
# 로컬은 PHP 8.2-fpm-alpine, 여기는 8.2 CLI 다. 런타임 버전을 맞춰 두지 않으면
# "내 컴퓨터에서는 됩니다"가 CI 통과 여부로 바뀔 뿐이다.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞의 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: 문법 · 단위 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # 로컬 Dockerfile 이 설치하는 확장과 맞춘다.
          extensions: mbstring, intl, bcmath, mysqli, pdo_mysql
          coverage: none
          ini-values: date.timezone=UTC, error_reporting=E_ALL

      - name: composer 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # --no-scripts: composer.json 에 스크립트가 늘어났을 때
      # CI 가 조용히 그걸 실행하는 일이 없도록 명시적으로 막는다.
      - name: 의존성 설치
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      # 문법 검사는 src/ 뿐 아니라 application/ 도 본다.
      # CI3 컨트롤러는 단위 테스트가 닿지 않는 영역이라
      # 문법 오류를 잡아 주는 곳이 여기밖에 없다.
      - name: 문법 검사
        run: |
          set -e
          files=$(find src tests application public -name '*.php' -type f | sort)
          echo "$files" | wc -l | xargs echo "검사 대상:"
          for f in $files; do php -l "$f" > /dev/null; done
          echo "문법 오류 없음"

      - name: 단위 테스트
        run: vendor/bin/phpunit --colors=never

      # ADR-017 의 경계가 실제로 지켜지는지 확인한다.
      # src/ 가 CI3 를 참조하기 시작하면 그 순간 단위 테스트가 불가능해지고,
      # 그러면 어댑터·원장·멱등성 로직의 검증 수단이 통째로 사라진다.
      # 문서로만 적어 둔 규칙은 지켜지지 않는다 — 그래서 여기서 강제한다.
      - name: 경계 검사 (src/ 는 CodeIgniter 를 모른다)
        run: |
          if grep -rnE '\b(CI_Controller|CI_Model|CI_Migration|get_instance|\$this->load)\b' src/; then
            echo "src/ 에서 CodeIgniter 를 참조했습니다. 도메인 로직은 프레임워크에 의존하지 않습니다 (ADR-017)."
            exit 1
          fi
          echo "경계 유지됨"

  infra:
    name: 인프라 구성 파일
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 값이 없으면 ${VAR:?} 때문에 검증 자체가 실패한다.
      # 자리만 채우는 더미 값이고, 실제 값은 서버의 .env 에만 있다.
      - name: 더미 .env
        run: |
          cp .env.example .env
          {
            echo 'MYSQL_ROOT_PASSWORD=ci-dummy'
            echo 'MYSQL_PASSWORD=ci-dummy'
            echo 'REPL_PASSWORD=ci-dummy'
            echo 'ENCRYPTION_KEY=00000000000000000000000000000000'
            echo 'ACME_EMAIL=ci@example.invalid'
          } >> .env

      - name: docker compose 유효성
        run: docker compose config --quiet

      # 엔트리포인트 스크립트를 실제로 돌려서 검증한다.
      # 설정 생성 로직을 CI 에 다시 옮겨 적으면 두 벌이 갈라지고,
      # 갈라진 쪽이 통과하는 CI 는 아무것도 보장하지 않는다.
      #
      # 네 가지 상태를 모두 본다. 특히 첫 번째가 중요하다 —
      # 인증서가 없는 상태에서도 떠야 ACME 챌린지를 받아 인증서를 받는다.
      # nginx 는 ssl_certificate 파일이 없으면 기동 자체를 거부하므로,
      # 이게 깨지면 새 서버에서 영영 인증서를 못 받는 교착에 빠진다.
      - name: OpenResty 설정 생성 (인증서 유무 × 추적 도메인 유무)
        run: |
          set -e
          mkdir -p /tmp/le/live/example.com /tmp/le/live/example.net /tmp/noce
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=ci.invalid' \
            -keyout /tmp/le/live/example.com/privkey.pem \
            -out /tmp/le/live/example.com/fullchain.pem 2>/dev/null
          cp /tmp/le/live/example.com/*.pem /tmp/le/live/example.net/

          # 기동 대신 문법 검사로 바꾼 사본
          sed 's|^exec openresty.*|exec openresty -t|' \
            docker/openresty/entrypoint.sh > /tmp/entrypoint-test.sh

          # 상태: "설명|TRACK_DOMAIN|인증서디렉터리"
          for c in \
            "인증서 없음 · 추적 없음 (첫 기동)||/tmp/noce" \
            "인증서 있음 · 추적 없음||/tmp/le" \
            "인증서 있음 · 추적 있음|example.net|/tmp/le" \
            "추적 도메인만 있고 인증서 없음|example.org|/tmp/le" \
          ; do
            desc=${c%%|*}; rest=${c#*|}
            track=${rest%%|*}; le=${rest#*|}
            echo "──── $desc"
            docker run --rm --add-host app:127.0.0.1 \
              -e SHOP_DOMAIN=example.com -e TRACK_DOMAIN="$track" \
              -v "$PWD/docker/openresty/nginx.conf":/usr/local/openresty/nginx/conf/nginx.template:ro \
              -v "$PWD/docker/openresty/templates":/usr/local/openresty/nginx/templates:ro \
              -v "$PWD/docker/openresty/lua":/usr/local/openresty/nginx/lua:ro \
              -v "$PWD/docker/openresty/conf.d":/etc/nginx/conf.d:ro \
              -v "$le":/etc/letsencrypt:ro \
              -v /tmp/entrypoint-test.sh:/entrypoint-test.sh:ro \
              openresty/openresty:alpine sh /entrypoint-test.sh
          done
      - name: 잘못된 도메인은 거절되는가
        run: |
          # 파이프라인의 종료 코드는 마지막 명령(tee)의 것이라 항상 0 이다.
          # 그래서 출력을 변수로 받고 종료 코드를 따로 본다.
          set +e
          out=$(docker run --rm \
                  -e SHOP_DOMAIN='bad;domain' -e TRACK_DOMAIN= \
                  -v "$PWD/docker/openresty/entrypoint.sh":/entrypoint.sh:ro \
                  openresty/openresty:alpine sh /entrypoint.sh 2>&1)
          rc=$?
          set -e
          echo "$out"

          if [ "$rc" -eq 0 ]; then
            echo "형식 검증을 통과했습니다. 거절했어야 합니다."
            exit 1
          fi

          # 종료 코드만 보면 약한 검사다 — 다른 이유로 죽어도 통과한다.
          # 우리가 의도한 그 메시지로 거절했는지까지 확인한다.
          if ! printf '%s' "$out" | grep -q '도메인 형식이 올바르지 않습니다'; then
            echo "거절은 됐지만 형식 검증이 아닌 다른 이유입니다."
            exit 1
          fi
          echo "거절 확인"
