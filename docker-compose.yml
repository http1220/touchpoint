name: touchpoint

# 대상 조직 스택에 정렬한 구성 → docs/decisions/ADR-014
#   OpenResty(Nginx+Lua) · PHP 8.2 + CodeIgniter 3 · MySQL 프라이머리 + 복제본
#
# t3.small(2GB) 전제. t3.micro(1GB)로는 MySQL 2대가 올라가지 않는다.
# 메모리 상한 합계 약 1.2GB.

services:
  # ── 엣지 ──────────────────────────────────────────────
  # Lua가 읽기 복제본을 배정하고, 모바일 UA를 302로 분기한다.
  openresty:
    image: openresty/openresty:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?SHOP_DOMAIN 이 필요합니다}
      TRACK_DOMAIN: ${TRACK_DOMAIN:?TRACK_DOMAIN 이 필요합니다}
    volumes:
      - ./docker/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.template:ro
      - ./docker/openresty/conf.d:/etc/nginx/conf.d:ro
      - ./docker/openresty/lua:/usr/local/openresty/nginx/lua:ro
      - ./public:/var/www/html/public:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    # nginx.conf 안의 ${SHOP_DOMAIN} 등을 치환한 뒤 기동한다.
    command: >
      sh -c "envsubst '$$SHOP_DOMAIN $$TRACK_DOMAIN'
             < /usr/local/openresty/nginx/conf/nginx.template
             > /usr/local/openresty/nginx/conf/nginx.conf
             && exec openresty -g 'daemon off;'"
    mem_limit: 128m
    depends_on:
      - app

  # ── 인증서 발급 (일회성) ──────────────────────────────
  # docker compose --profile cert run --rm certbot
  # 처음에는 반드시 --staging 을 붙여 검증한다. docs/setup.md 4장
  certbot:
    profiles: ["cert"]
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "certbot certonly --webroot -w /var/www/certbot $${ACME_STAGING:+--staging}
       --email $${ACME_EMAIL} --agree-tos --no-eff-email
       -d $${SHOP_DOMAIN} -d lp.$${SHOP_DOMAIN} -d m.$${SHOP_DOMAIN} -d app.$${SHOP_DOMAIN}
       --cert-name $${SHOP_DOMAIN}
       && certbot certonly --webroot -w /var/www/certbot $${ACME_STAGING:+--staging}
       --email $${ACME_EMAIL} --agree-tos --no-eff-email
       -d api.$${TRACK_DOMAIN}
       --cert-name $${TRACK_DOMAIN}"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 이 필요합니다}
      SHOP_DOMAIN: ${SHOP_DOMAIN}
      TRACK_DOMAIN: ${TRACK_DOMAIN}
      # 비어 있지 않으면 --staging 이 붙는다. 처음에는 반드시 채운다.
      ACME_STAGING: ${ACME_STAGING:-}

  # ── 앱 ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: touchpoint/php:local
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - .:/var/www/html
    mem_limit: 256m
    depends_on:
      mysql-primary:
        condition: service_healthy

  # app과 같은 이미지. 커맨드만 다르다.
  # --scale worker=4 로 늘려 SKIP LOCKED 동시성을 검증한다. ADR-004
  # CI3에는 spark가 없으므로 CLI 컨트롤러를 직접 호출한다.
  worker:
    profiles: ["worker"]
    image: touchpoint/php:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "public/index.php", "cli/dispatch", "work"]
    env_file: [.env]
    volumes:
      - .:/var/www/html
    mem_limit: 128m
    depends_on:
      mysql-primary:
        condition: service_healthy

  # ── 데이터 ────────────────────────────────────────────
  # 쓰기 전용. 그리고 읽기 대상 rdb1 로도 쓴다(지연 0).
  mysql-primary:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=160M
      - --max-connections=60
      - --skip-name-resolve
      - --slow-query-log=1
      - --long-query-time=0.3
      - --log-queries-not-using-indexes=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 이 필요합니다}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REPL_PASSWORD: ${REPL_PASSWORD:?REPL_PASSWORD 이 필요합니다}
      TZ: UTC
    volumes:
      - mysql_primary:/var/lib/mysql
      - ./docker/mysql/primary-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # 읽기 대상 rdb2. 실제 복제 지연이 발생하는 쪽.
  # 지연을 인위적으로 키우려면 SOURCE_DELAY 를 쓴다 → docs/failure-scenarios.md E-1
  mysql-replica:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --server-id=2
      - --relay-log=relay-bin
      - --read-only=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=40
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REPL_PASSWORD: ${REPL_PASSWORD}
      REPL_SOURCE_HOST: mysql-primary
      REPL_DELAY_SECONDS: ${REPL_DELAY_SECONDS:-0}
      TZ: UTC
    volumes:
      - mysql_replica:/var/lib/mysql
      - ./docker/mysql/replica-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 320m
    depends_on:
      mysql-primary:
        condition: service_healthy

volumes:
  certbot_conf:
  certbot_www:
  mysql_primary:
  mysql_replica:
