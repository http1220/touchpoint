# touchpoint · OpenResty
#
# 대상 조직이 OpenResty(Nginx + Lua)를 쓴다는 것을 응답 헤더로 확인했고,
# Lua 계층에서 읽기 복제본을 배정하는 정황도 쿠키로 확인했다.
# 그래서 Caddy를 걷어내고 같은 구조로 맞췄다. → docs/decisions/ADR-013

worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 로그는 JSON으로. 구조화 로그 + 상관 ID → docs/decisions/ADR-012
    log_format json escape=json '{'
        '"ts":"$time_iso8601",'
        '"trace_id":"$request_id",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"read_target":"$read_target",'
        '"ua":"$http_user_agent",'
        '"ref":"$http_referer"'
    '}';
    access_log /dev/stdout json;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # 복제본 라운드로빈 카운터를 워커 간에 공유
    lua_shared_dict replica_rr 1m;
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # 개발 중에는 Lua 코드 캐시를 끈다. 운영 전환 시 on.
    lua_code_cache off;

    # ── 모바일 판별 ─────────────────────────────────────────
    # 대상 조직은 UA를 보고 302로 m. 호스트에 넘긴다.
    # 광고 랜딩이 이 302를 한 번 더 타면 유입 파라미터 유실 지점이 늘어난다.
    # docs/failure-scenarios.md C-4 에서 이걸 재현한다.
    map $http_user_agent $is_mobile {
        default                          0;
        "~*(iPhone|Android.+Mobile|iPod)" 1;
    }

    # ── 공통 ────────────────────────────────────────────────
    map $host $unused_common { default ""; }

    # ── 80번: ACME 챌린지와 리다이렉트 ───────────────────────
    #
    # 이 블록만은 인증서와 무관하게 항상 뜬다. 그래야 인증서를 받을 수 있다.
    server {
        listen 80 default_server;
        server_name _;

        # log_format 이 $read_target 을 참조한다. 443 블록이 하나도 없는
        # 첫 기동에서도 변수가 선언돼 있어야 nginx 가 뜬다.
        set $read_target "";

        # certbot 이 여기에 챌린지 파일을 쓴다.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 인증서가 있으면 https 로 보내고, 없으면 안내를 낸다.
        # 인증서가 없는데 https 로 보내면 사용자는 연결 실패만 보게 되고,
        # 무엇이 덜 됐는지 알 수 없다.
        include /usr/local/openresty/nginx/servers/http-root.inc;
    }

    # ── HTTPS 호스트 ─────────────────────────────────────────
    #
    # 인증서가 실재하는 도메인의 서버 블록만 여기에 생긴다.
    # nginx 는 ssl_certificate 파일이 없으면 기동 자체를 거부하는데,
    # 그러면 위의 80번 블록까지 같이 죽어서 인증서를 영영 못 받는다.
    # 그 순환을 끊으려고 설정을 쪼갰다. → docker/openresty/entrypoint.sh
    include /usr/local/openresty/nginx/servers/*.https.conf;
}
