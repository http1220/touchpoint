# touchpoint · OpenResty
#
# 대상 조직이 OpenResty(Nginx + Lua)를 쓴다는 것을 응답 헤더로 확인했고,
# Lua 계층에서 읽기 복제본을 배정하는 정황도 쿠키로 확인했다.
# 그래서 Caddy를 걷어내고 같은 구조로 맞췄다. → docs/decisions/ADR-013

worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 로그는 JSON으로. 구조화 로그 + 상관 ID → docs/decisions/ADR-012
    log_format json escape=json '{'
        '"ts":"$time_iso8601",'
        '"trace_id":"$request_id",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"read_target":"$read_target",'
        '"ua":"$http_user_agent",'
        '"ref":"$http_referer"'
    '}';
    access_log /dev/stdout json;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # 복제본 라운드로빈 카운터를 워커 간에 공유
    lua_shared_dict replica_rr 1m;
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # 개발 중에는 Lua 코드 캐시를 끈다. 운영 전환 시 on.
    lua_code_cache off;

    # ── 모바일 판별 ─────────────────────────────────────────
    # 대상 조직은 UA를 보고 302로 m. 호스트에 넘긴다.
    # 광고 랜딩이 이 302를 한 번 더 타면 유입 파라미터 유실 지점이 늘어난다.
    # docs/failure-scenarios.md C-4 에서 이걸 재현한다.
    map $http_user_agent $is_mobile {
        default                          0;
        "~*(iPhone|Android.+Mobile|iPod)" 1;
    }

    # ── 공통 ────────────────────────────────────────────────
    map $host $unused_common { default ""; }

    server {
        listen 80 default_server;
        server_name _;

        # ACME webroot. certbot이 여기에 챌린지 파일을 쓴다.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── 루트 도메인 ──────────────────────────────────────────
    # 서버 블록이 없으면 첫 443 블록이 응답해 인증서 불일치 경고가 난다.
    # 이 프로젝트 기간에는 랜딩으로 넘긴다.
    # 나중에 개인 사이트를 올리면 이 블록만 교체하면 된다.
    server {
        listen 443 ssl;
        http2 on;
        server_name ${SHOP_DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${SHOP_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${SHOP_DOMAIN}/privkey.pem;
        include /etc/nginx/conf.d/tls-common.conf;

        return 302 https://lp.${SHOP_DOMAIN}$request_uri;
    }

    # ── lp. 랜딩 · 브리지 (광고주 측) ────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name lp.${SHOP_DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${SHOP_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${SHOP_DOMAIN}/privkey.pem;
        include /etc/nginx/conf.d/tls-common.conf;

        set $read_target "";

        # 모바일이면 m. 으로 302. 쿼리스트링은 그대로 넘긴다.
        # (넘긴다고 해서 유실이 없는 것은 아니다 — 실험 대상이다)
        if ($is_mobile) {
            return 302 https://m.${SHOP_DOMAIN}$request_uri;
        }

        access_by_lua_block {
            require("replica").assign()
        }

        include /etc/nginx/conf.d/php-app.conf;

        # 브리지는 캐시되면 안 된다. 301을 쓰지 않는 것과 같은 이유.
        location /go {
            add_header Cache-Control "no-store" always;
            include /etc/nginx/conf.d/php-pass.conf;
        }
    }

    # ── m. 모바일 (같은 앱, 다른 뷰) ─────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name m.${SHOP_DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${SHOP_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${SHOP_DOMAIN}/privkey.pem;
        include /etc/nginx/conf.d/tls-common.conf;

        set $read_target "";
        access_by_lua_block { require("replica").assign() }
        include /etc/nginx/conf.d/php-app.conf;
    }

    # ── app. 서비스 · 전환 (광고주 측) ───────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name app.${SHOP_DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${SHOP_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${SHOP_DOMAIN}/privkey.pem;
        include /etc/nginx/conf.d/tls-common.conf;

        set $read_target "";
        access_by_lua_block { require("replica").assign() }
        include /etc/nginx/conf.d/php-app.conf;
    }

    # ── api. 수집 (추적 측 · 다른 등록 도메인) ───────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api.${TRACK_DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${TRACK_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${TRACK_DOMAIN}/privkey.pem;
        include /etc/nginx/conf.d/tls-common.conf;

        set $read_target "";
        access_by_lua_block { require("replica").assign() }

        # CORS 헤더는 여기서 붙이지 않는다.
        # 오리진을 정확히 반향하고 Vary를 붙이는 판단은 앱이 해야 한다.
        # docs/api-spec.md 3장
        location ~ ^/(collect|conversion)$ {
            add_header Cache-Control "no-store" always;
            include /etc/nginx/conf.d/php-pass.conf;
        }

        include /etc/nginx/conf.d/php-app.conf;
    }
}
