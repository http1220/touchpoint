# 공통 앱 처리 — 각 server 블록에서 include 한다.

root /var/www/html/public;
index index.php;

# CI3는 /index.php 를 프론트 컨트롤러로 쓴다.
# 대상 조직은 /index.php 가 그대로 200을 반환하는데(관측),
# 여기서는 감춘다 — 정렬은 하되 안 좋은 것까지 따라할 이유는 없다.
location / {
    try_files $uri $uri/ /index.php$is_args$args;
}

location ~ \.php$ {
    include /etc/nginx/conf.d/php-pass.conf;
}

# 없는 경로는 404를 반환한다.
# 대상 조직은 소프트 404(200 + 홈 렌더)인데(관측), 이건 따라하지 않는다.
# 404 비율로 장애를 탐지할 수 없게 되기 때문이다. research/09 참조.
location = /404.html {
    internal;
}

location ~ /\.(?!well-known) {
    deny all;
}
