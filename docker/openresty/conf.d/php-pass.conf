# FastCGI 전달 — Lua가 고른 읽기 대상을 앱에 넘긴다.

# 앱 주소를 요청 시점에 다시 푼다.
#
# `fastcgi_pass app:9000;` 처럼 이름을 박으면 nginx 는 **기동할 때 한 번**
# IP 로 바꿔 들고 있는다. 2026-09-15 app 을 재생성하면서 worker 를 함께
# 올리자 worker 가 app 의 옛 IP(172.20.0.4)를 받았고, 엣지는 PHP 요청을
# **worker 컨테이너로** 보내 40초간 전 호스트가 502 였다. openresty 를
# reload 해서야 풀렸다. → docs/worklog.md 09-15
#
# 변수로 넘기면 매 요청 resolver 를 거친다. 127.0.0.11 은 Docker 내장 DNS 다.
# valid=10s — 재생성 직후 최대 10초는 옛 IP 가 남을 수 있다.
resolver      127.0.0.11 valid=10s ipv6=off;
set $php_upstream app:9000;
fastcgi_pass  $php_upstream;
fastcgi_index  index.php;
include        fastcgi_params;

fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param HTTPS           on;

# Lua가 access 단계에서 채운 값. 앱은 이걸 보고 읽기 커넥션을 고른다.
fastcgi_param AB_READ_TARGET  $read_target;

# 요청 상관 ID. 앱 로그·dispatch_log까지 같은 값을 달고 흐른다.
fastcgi_param AB_TRACE_ID     $request_id;

fastcgi_read_timeout 30s;
